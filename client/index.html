  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <!-- Immediate Zero-Latency Splash Screen to eliminate any blank screen on first load -->
    <div id="root">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #fafafa; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
              <rect width="32" height="32" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
              <path d="M9 16H23M9 11H19M9 21H16" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #f4f4f5;">Co<span style="color: #a1a1aa;">Draft</span></span>
          </div>
          <div style="width: 140px; height: 3px; background: #27272a; border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 9999px; animation: codraft-initial-bar 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes codraft-initial-bar {
          0% { left: -45%; width: 35%; }
          50% { left: 30%; width: 50%; }
          100% { left: 100%; width: 35%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
