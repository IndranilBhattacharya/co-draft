<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121216" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle ambient glow in center -->
  <circle cx="600" cy="315" r="300" fill="#27272a" opacity="0.35" filter="url(#glow)" />
  <circle cx="950" cy="180" r="180" fill="#3f3f46" opacity="0.15" filter="url(#glow)" />

  <!-- Decorative grid / beam lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 140)">
    <!-- Brand Icon -->
    <g transform="translate(0, 0)">
      <circle cx="40" cy="40" r="38" fill="#18181b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
      <path d="M26 23a4 4 0 0 1 4-4h14l10 10v26a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4z" fill="#f4f4f5" />
      <path d="M44 19v10h10z" fill="#a1a1aa" />
      <rect x="32" y="37" width="16" height="3" rx="1.5" fill="#52525b" />
      <rect x="32" y="44" width="11" height="3" rx="1.5" fill="#52525b" />
    </g>

    <!-- Main Title -->
    <text x="100" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">
      <tspan fill="url(#textGrad)">Co</tspan>Draft
    </text>

    <!-- Tagline -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="36" fill="#f4f4f5" letter-spacing="-0.5">
      Instant collaboration. No clutter. Just draft and go.
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#a1a1aa" letter-spacing="-0.2">
      Real-time collaborative document editing with live presence, markdown syntax, and PDF export.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 255)">
      <!-- Badge 1: Real-time Sync -->
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#34d399" />
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#e4e4e7">Real-Time Sync</text>

      <!-- Badge 2: Live Presence -->
      <rect x="195" y="0" width="185" height="42" rx="21" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="217" cy="21" r="5" fill="#60a5fa" />
      <text x="231" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#e4e4e7">Live Caret Presence</text>

      <!-- Badge 3: Markdown -->
      <rect x="395" y="0" width="165" height="42" rx="21" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="417" cy="21" r="5" fill="#f472b6" />
      <text x="431" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#e4e4e7">Markdown Rules</text>

      <!-- Badge 4: PDF Export -->
      <rect x="575" y="0" width="150" height="42" rx="21" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="597" cy="21" r="5" fill="#fbbf24" />
      <text x="611" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#e4e4e7">PDF Export</text>
    </g>
  </g>
</svg>
